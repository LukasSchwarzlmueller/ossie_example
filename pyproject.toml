[project]
name = "ossie-example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apache-ossie",
    "apache-ossie-databricks",
    "snowflake-connector-python>=4.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[tool.uv.sources]
# Upstream split into two repos on 2026-10-21: apache/ossie keeps the spec and
# the core `apache-ossie` package (python/), apache/ossie-converters has one
# top-level folder per converter and pins apache/ossie as its `ossie/`
# submodule. Core comes from that submodule, not from apache/ossie directly:
# the dbt converter declares `apache-ossie = { path = "../ossie/python" }`, and
# uv refuses two different URLs for the same package. Bumping the one
# ossie-converters rev below bumps core to the version upstream tests against.
#
# apache-ossie-databricks stays on an old apache/ossie commit on purpose:
# upstream removed the Python Databricks converter (#531), before the split,
# and roundtrip_databricks, powerbi_databricks and databricks_python_deprecated
# still use it. It only depends on pyyaml, so it does not conflict with the
# newer apache-ossie. databricks/ uses the Java converter instead
# (databricks/build_converter.sh).
apache-ossie = { git = "https://github.com/apache/ossie-converters", subdirectory = "ossie/python", rev = "853c52986cd03508fe233fbab8c4213890943095" }
apache-ossie-dbt = { git = "https://github.com/apache/ossie-converters", subdirectory = "dbt", rev = "853c52986cd03508fe233fbab8c4213890943095" }
apache-ossie-snowflake = { git = "https://github.com/apache/ossie-converters", subdirectory = "snowflake", rev = "853c52986cd03508fe233fbab8c4213890943095" }
apache-ossie-microsoft = { git = "https://github.com/apache/ossie-converters", subdirectory = "microsoft", rev = "853c52986cd03508fe233fbab8c4213890943095" }
apache-ossie-databricks = { git = "https://github.com/apache/ossie", subdirectory = "converters/databricks", rev = "a5bdbbcd981c3dfb93f99ba8221602e1c3108f8c" }

[dependency-groups]
dev = [
    "apache-ossie-snowflake",
    "apache-ossie-dbt",
    "apache-ossie-microsoft[tom]",
    "databricks-sdk>=0.133.0",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "dbt-metricflow>=0.15.0",
]
