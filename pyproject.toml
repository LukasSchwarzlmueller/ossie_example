[project]
name = "ossie-example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apache-ossie",
    "apache-ossie-databricks",
    "snowflake-connector-python>=4.7.2",
]

[tool.uv.sources]
# Pinned to a commit after upstream's internal OSI -> Ossie rename
# (OSIDocument -> OssieDocument, osi_to_msi.py -> ossie_to_msi.py, etc).
# Three packages were renamed as part of the same rename and need updating
# here too: apache-ossie-gsf -> apache-ossie-nvidia-gsf (converters/gsf ->
# converters/nvidia), honeydew-osi -> honeydew-ossie, osi-omni -> ossie-omni.
apache-ossie = { git = "https://github.com/apache/ossie", subdirectory = "python", rev = "b5da5d66f0da4a0cd3388d52201dbf5523221a77" }
apache-ossie-dbt = { git = "https://github.com/apache/ossie", subdirectory = "converters/dbt", rev = "b5da5d66f0da4a0cd3388d52201dbf5523221a77" }
apache-ossie-databricks = { git = "https://github.com/apache/ossie", subdirectory = "converters/databricks", rev = "b5da5d66f0da4a0cd3388d52201dbf5523221a77" }
apache-ossie-nvidia-gsf = { git = "https://github.com/apache/ossie", subdirectory = "converters/nvidia", rev = "b5da5d66f0da4a0cd3388d52201dbf5523221a77" }
apache-ossie-snowflake = { git = "https://github.com/apache/ossie", subdirectory = "converters/snowflake", rev = "b5da5d66f0da4a0cd3388d52201dbf5523221a77" }
ossie-omni = { git = "https://github.com/apache/ossie", subdirectory = "converters/omni", rev = "b5da5d66f0da4a0cd3388d52201dbf5523221a77" }
apache-ossie-gooddata = { git = "https://github.com/apache/ossie", subdirectory = "converters/gooddata", rev = "b5da5d66f0da4a0cd3388d52201dbf5523221a77" }
honeydew-ossie = { git = "https://github.com/apache/ossie", subdirectory = "converters/honeydew", rev = "b5da5d66f0da4a0cd3388d52201dbf5523221a77" }
apache-ossie-wisdom = { git = "https://github.com/apache/ossie", subdirectory = "converters/wisdom", rev = "b5da5d66f0da4a0cd3388d52201dbf5523221a77" }

[dependency-groups]
dev = [
    "apache-ossie-gooddata",
    "apache-ossie-nvidia-gsf",
    "apache-ossie-snowflake",
    "apache-ossie-wisdom",
    "apache-ossie-dbt",
    "databricks-sdk>=0.133.0",
    "dbt-core>=1.12.3",
    "dbt-duckdb>=1.11.0",
    "dbt-metricflow>=0.14.0",
    "honeydew-ossie",
    "ossie-omni",
]
