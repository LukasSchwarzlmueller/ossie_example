[project]
name = "ossie-example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apache-ossie",
    "apache-ossie-databricks",
    "snowflake-connector-python>=4.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[tool.uv.sources]
# Pinned to a commit after upstream's internal OSI -> Ossie rename
# (OSIDocument -> OssieDocument, osi_to_msi.py -> ossie_to_msi.py, etc) and
# after its move to flat semantic model documents (no `semantic_model:` list).
# apache-ossie-databricks stays on the older commit on purpose: upstream
# removed the Python Databricks converter (#531) and the roundtrip_databricks,
# powerbi_databricks and databricks_python_deprecated scripts still use it. It
# only depends on pyyaml, so it does not conflict with the newer apache-ossie.
apache-ossie = { git = "https://github.com/apache/ossie", subdirectory = "python", rev = "74968116780058f42d678cba3594e35390b5be12" }
apache-ossie-dbt = { git = "https://github.com/apache/ossie", subdirectory = "converters/dbt", rev = "74968116780058f42d678cba3594e35390b5be12" }
apache-ossie-databricks = { git = "https://github.com/apache/ossie", subdirectory = "converters/databricks", rev = "a5bdbbcd981c3dfb93f99ba8221602e1c3108f8c" }
apache-ossie-snowflake = { git = "https://github.com/apache/ossie", subdirectory = "converters/snowflake", rev = "74968116780058f42d678cba3594e35390b5be12" }
apache-ossie-microsoft = { git = "https://github.com/apache/ossie", subdirectory = "converters/microsoft", rev = "74968116780058f42d678cba3594e35390b5be12" }

[dependency-groups]
dev = [
    "apache-ossie-snowflake",
    "apache-ossie-dbt",
    "apache-ossie-microsoft[tom]",
    "databricks-sdk>=0.133.0",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "dbt-metricflow>=0.15.0",
]
