version: "1.1"
source: "ossi.test.orders"
comment: "Minimal orders/customers demo model for the OSI meetup talk"
joins:
- name: "customers"
  source: "ossi.test.customers"
  using:
  - "customer_id"
  rely:
    at_most_one_match: true
dimensions:
- name: "order_id"
  expr: "order_id"
- name: "customer_id"
  expr: "customer_id"
- name: "order_date"
  expr: "order_date"
  comment: "The date the order was placed."
  display_name: "Order Date"
- name: "order_amount"
  expr: "order_amount"
  display_name: "Order Amount"
  synonyms:
  - "amount"
  - "order total"
  - "order value"
- name: "customer_key"
  expr: "customers.customer_id"
- name: "customer_name"
  expr: "LOWER(customers.customer_name)"
  display_name: "Customer Name"
- name: "customer_segment"
  expr: "customers.customer_segment"
  display_name: "Customer Segment"
measures:
- name: "total_revenue"
  expr: "SUM(order_amount)"
  comment: "Total revenue across all orders"
  synonyms:
  - "revenue"
  - "sales"
- name: "order_count"
  expr: "COUNT(*)"
  comment: "Number of orders"
- name: "avg_order_value"
  expr: "AVG(order_amount)"
  comment: "Average order value"
  synonyms:
  - "AOV"
  - "average order value"
  - "average purchase value"
- name: "enterprise_revenue"
  expr: "SUM(order_amount) FILTER (WHERE customers.customer_segment = 'Enterprise')"
  comment: "Revenue from Enterprise customers only"
