version: "0.2.0.dev0"
name: "orders"
description: "Minimal orders/customers demo model for the OSI meetup talk"
datasets:
- name: "orders"
  source: "ossi.test.orders"
  fields:
  - name: "order_id"
    expression:
      dialects:
      - dialect: "OSSIE_SQL_2026"
        expression: "order_id"
  - name: "customer_id"
    expression:
      dialects:
      - dialect: "OSSIE_SQL_2026"
        expression: "customer_id"
  - name: "order_date"
    expression:
      dialects:
      - dialect: "OSSIE_SQL_2026"
        expression: "order_date"
    description: "The date the order was placed."
    label: "Order Date"
  - name: "order_amount"
    expression:
      dialects:
      - dialect: "OSSIE_SQL_2026"
        expression: "order_amount"
    label: "Order Amount"
    ai_context:
      synonyms:
      - "amount"
      - "order total"
      - "order value"
  - name: "customer_name"
    expression:
      dialects:
      - dialect: "OSSIE_SQL_2026"
        expression: "LOWER(customers.customer_name)"
    label: "Customer Name"
- name: "customers"
  source: "ossi.test.customers"
  unique_keys:
  - - "customer_id"
  fields:
  - name: "customer_key"
    expression:
      dialects:
      - dialect: "OSSIE_SQL_2026"
        expression: "customer_id"
  - name: "customer_segment"
    expression:
      dialects:
      - dialect: "OSSIE_SQL_2026"
        expression: "customer_segment"
    label: "Customer Segment"
relationships:
- name: "orders_to_customers"
  from: "orders"
  to: "customers"
  from_columns:
  - "customer_id"
  to_columns:
  - "customer_id"
  custom_extensions:
  - vendor_name: "DATABRICKS"
    data: "{\"_v\": 1, \"rely\": {\"at_most_one_match\": true}}"
metrics:
- name: "total_revenue"
  expression:
    dialects:
    - dialect: "OSSIE_SQL_2026"
      expression: "SUM(order_amount)"
  description: "Total revenue across all orders"
  ai_context:
    synonyms:
    - "revenue"
    - "sales"
- name: "order_count"
  expression:
    dialects:
    - dialect: "OSSIE_SQL_2026"
      expression: "COUNT(*)"
  description: "Number of orders"
- name: "avg_order_value"
  expression:
    dialects:
    - dialect: "OSSIE_SQL_2026"
      expression: "AVG(order_amount)"
  description: "Average order value"
  ai_context:
    synonyms:
    - "AOV"
    - "average order value"
    - "average purchase value"
- name: "enterprise_revenue"
  expression:
    dialects:
    - dialect: "DATABRICKS"
      expression: "SUM(order_amount) FILTER (WHERE customers.customer_segment = 'Enterprise')"
  description: "Revenue from Enterprise customers only"
